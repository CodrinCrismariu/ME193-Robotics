[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-in-mobile-robotics"
version = "0.1.0"
description = "Coursework and robot programs for AI in Mobile Robotics, driving LEGO(R) Education hardware."
readme = "README.md"
# legoeducation requires Python 3.14 or newer.
requires-python = ">=3.14"
dependencies = ["legoeducation"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "examples", "scripts"]
