<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Lock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Codrin's sign lock <small>sign the code with the letters C · O · D · R · I · N</small></h1>
  <span id="status" class="status">Starting camera…</span>
</header>

<main>
  <section class="stage">
    <div class="viewwrap" id="viewwrap">
      <canvas id="view" width="640" height="480"></canvas>
    </div>
    <div class="readout">
      <span id="handInfo">no hand</span>
      <span id="speed"></span>
    </div>
    <div class="group">
      <h2>What the network sees</h2>
      <div id="bars" class="bars"></div>
    </div>
  </section>

  <aside class="panel">
    <div class="lockcard" id="lockcard">
      <svg class="padlock" viewBox="0 0 200 230" aria-hidden="true">
        <g id="shackle"><path d="M58 112 V72 a42 42 0 0 1 84 0 V112" /></g>
        <rect class="body" x="28" y="104" width="144" height="118" rx="18" />
        <circle class="hole" cx="100" cy="152" r="13" />
        <path class="hole" d="M93 158 h14 l5 38 h-24 z" />
      </svg>
      <div class="leds" id="leds"></div>
      <div class="slots" id="slots"></div>
      <div class="hold">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="42" /><circle id="ring" class="ring" cx="50" cy="50" r="42" /></svg>
        <span id="cand">–</span>
      </div>
      <p id="msg" class="msg">Press the button to start</p>
      <button id="wake" class="bigbtn" type="button">Press the button <kbd>Space</kbd></button>
    </div>

    <details class="group">
      <summary>Settings</summary>
      <label class="field">Secret code (3 to 8 letters from C O D R I N) <input id="code" maxlength="8" value="CODRIN" autocomplete="off"></label>
      <label class="field">Hold a letter for <input type="range" id="holdMs" min="300" max="2000" step="100" value="800"> <output id="holdOut">0.8 s</output></label>
      <label class="field">Minimum confidence <input type="range" id="minConf" min="0.4" max="0.95" step="0.05" value="0.7"> <output id="confOut">70%</output></label>
      <label class="field">Smooth over <input type="range" id="smooth" min="1" max="10" step="1" value="4"> <output id="smoothOut">4 frames</output></label>
      <p id="modelInfo" class="note"></p>
    </details>

    <div class="group">
      <h2>Camera</h2>
      <select id="camera" aria-label="Camera"></select>
      <div class="row">
        <label><input type="checkbox" id="mirror" checked> Mirror the view</label>
        <button id="lockExp" type="button">Lock exposure</button>
      </div>
      <p id="camNote" class="note">Pick the USB webcam, not the laptop's built-in camera.</p>
    </div>
  </aside>
</main>

<script src="lock.js"></script>
</body>
</html>
